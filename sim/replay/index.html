<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Replay</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main aria-busy="true">
    <canvas id="screen" width="640" height="240" aria-label="Recorded flight"></canvas>
    <div class="controls">
      <button id="rewind" type="button" aria-label="Rewind" disabled><svg viewBox="0 0 16 16"><path d="M3 3h2v10H3zM13 3v10L6 8z"/></svg></button>
      <button id="step-back" type="button" aria-label="Previous frame" disabled><svg viewBox="0 0 16 16"><path d="M11 3v10L5 8z"/></svg></button>
      <button id="play-pause" type="button" aria-label="Play" disabled><svg viewBox="0 0 16 16"><path id="play-icon" d="M4 2.5v11L13 8z"/></svg></button>
      <button id="step-forward" type="button" aria-label="Next frame" disabled><svg viewBox="0 0 16 16"><path d="M5 3v10l6-5z"/></svg></button>
      <input id="timeline" type="range" min="0" max="1" step="0.05" value="0" aria-label="Timeline" disabled>
      <button id="previous-env" type="button" aria-label="Previous environment" disabled><svg viewBox="0 0 16 16"><path d="M10.5 3 5.5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
      <button id="next-env" type="button" aria-label="Next environment" disabled><svg viewBox="0 0 16 16"><path d="m5.5 3 5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
      <button id="random-env" type="button" aria-label="Random environment" disabled><svg viewBox="0 0 16 16"><rect x="2" y="2" width="12" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="5.5" cy="5.5" r="1.2"/><circle cx="8" cy="8" r="1.2"/><circle cx="10.5" cy="10.5" r="1.2"/></svg></button>
      <button id="view" type="button" aria-label="Camera view: split" disabled><svg viewBox="0 0 16 16"><rect x="1.5" y="4" width="13" height="8" fill="none" stroke="currentColor" stroke-width="1.4"/><path id="view-icon" d="M5.8 4v8M10.2 4v8" stroke="currentColor" stroke-width="1.4"/></svg></button>
    </div>
    <form id="instruct" hidden>
      <img id="goal" alt="" width="43" height="32" hidden>
      <input id="instruction" type="text" maxlength="300" autocomplete="off" placeholder="Fly to the red cone" aria-label="Goal instruction">
      <button id="send" type="submit" aria-label="Send instruction"><svg viewBox="0 0 16 16"><path d="M2 8h10M8 3.5 12.5 8 8 12.5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
    </form>
  </main>
  <div id="video-source" hidden></div>
</body>
</html>
