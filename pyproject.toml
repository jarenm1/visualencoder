[project]
name = "visenc"
version = "0.1.0"
description = "Sim-to-real visual encoder: DINOv3 distillation into a ViT with state-grounded evaluation"
requires-python = ">=3.13,<3.14"
dependencies = [
    "torch==2.14.1",
    "torchvision",
    "transformers>=4.56",
    "safetensors",
    "numpy",
    "pillow",
    "tqdm",
    "raylib",
    "jupyterlab",
    "ipykernel",
    "matplotlib",
    "lingbot-vision",
    "onnx>=1.23.2",
    "onnxscript>=0.7.2",
    "onnxruntime>=1.31.1",
    "nvidia-modelopt[torch]>=0.48.0",
    "pandas>=3.1.1",
    "ipywidgets>=8.1.9",
    "accelerate>=1.10",
]

[project.scripts]
visenc = "visenc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
lingbot-vision = { git = "https://github.com/robbyant/lingbot-vision", rev = "151e46321bae4399f8568829f190c7bdec216b49" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.basedpyright]
extraPaths = ["src", "sim/python"]
venvPath = "."
venv = ".venv"
